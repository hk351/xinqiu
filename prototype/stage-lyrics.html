<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Echo · 散字歌词舞台 Demo</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%;font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif}

  body{
    display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:center;
    gap:56px;padding:40px 32px 64px;
    background:radial-gradient(circle at 50% 0%,#161a26,#0a0b10 60%);
    color:#e8eaf0;
  }
  .stage{display:flex;flex-direction:column;align-items:center;gap:16px}
  .stage-tag{font-size:12px;letter-spacing:2px;color:rgba(232,234,240,.45);text-transform:uppercase}

  .phone{
    position:relative;width:390px;height:844px;border-radius:46px;overflow:hidden;
    background:#000;color:#fff;
    box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 0 10px #12131a,0 0 0 11px #1f2029;
  }

  canvas#dust{position:absolute;inset:0;width:100%;height:100%;display:block}

  /* ---------- 歌词舞台 ---------- */
  .stage-area{
    position:absolute;inset:0;
    display:grid;place-items:center;
    padding:0 26px;
  }
  .line{
    display:flex;align-items:center;justify-content:center;
    opacity:0;transition:opacity 420ms ease;
    width:100%;
  }
  .line.show{opacity:1}
  .line span{
    display:inline-block;
    font-family:"Songti SC","STSong","SimSun",serif;
    font-weight:700;
    line-height:1;
    color:rgba(255,255,255,.55);
    transition:color 260ms ease, text-shadow 260ms ease, opacity 260ms ease;
    will-change:transform,color,text-shadow;
  }
  /* 当前字：橙色/品牌色 + 多层辉光 */
  .line span.sing{
    color:#ffb08a;
    text-shadow:0 0 18px rgba(255,140,90,.9),0 0 46px rgba(255,120,70,.55),0 0 90px rgba(255,120,70,.28);
  }
  /* 已唱字 */
  .line span.done{color:#fff;text-shadow:0 0 10px rgba(255,255,255,.12)}

  /* ---------- 顶部胶囊 ---------- */
  .pill{
    position:absolute;top:64px;left:50%;transform:translateX(-50%);
    display:flex;align-items:center;gap:7px;
    height:34px;padding:0 15px;border-radius:17px;
    background:rgba(28,30,38,.82);backdrop-filter:blur(12px);
    font-size:12px;color:rgba(255,255,255,.85);
    transition:opacity 500ms ease;
    white-space:nowrap;
  }
  .pill svg{color:#6c8cff}

  /* ---------- 顶部返回 ---------- */
  .back{
    position:absolute;top:52px;left:14px;width:36px;height:36px;
    border:none;background:transparent;color:rgba(255,255,255,.55);
    display:grid;place-items:center;cursor:pointer;
    transition:opacity 500ms ease;
  }
  .back:active{color:#fff}

  /* ---------- 底部进度 ---------- */
  .bottom{
    position:absolute;left:0;right:0;bottom:0;padding:0 26px 30px;
    transition:opacity 500ms ease;
  }
  .time{display:flex;justify-content:space-between;font-size:10px;color:rgba(255,255,255,.4);letter-spacing:.5px}
  .track{height:2px;background:rgba(255,255,255,.14);border-radius:1px;margin-top:8px;overflow:hidden}
  .track i{display:block;height:100%;width:0;background:linear-gradient(90deg,#6c8cff,#ffb08a)}

  /* 控件自动隐藏，点击屏幕唤回 */
  .phone.ui-hidden .back,
  .phone.ui-hidden .bottom,
  .phone.ui-hidden .pill{opacity:0;pointer-events:none}
</style>
</head>
<body>
  <div class="stage">
    <div class="stage-tag">Echo · Lyric Stage / 散字版</div>
    <div class="phone" id="phone">
      <canvas id="dust"></canvas>

      <button class="back" aria-label="返回">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M15 5l-7 7 7 7"/></svg>
      </button>

      <div class="pill" id="pill">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l1.8 5.4L19 9l-5.2 1.6L12 16l-1.8-5.4L5 9l5.2-1.6zM19 15l.9 2.6L22 18l-2.1.8L19 21l-.9-2.2L16 18l2.1-.4z"/></svg>
        <span id="pillText">正在匹配最佳歌词…</span>
      </div>

      <div class="stage-area" id="stage">
        <div class="line" id="line"></div>
      </div>

      <div class="bottom">
        <div class="time"><span id="tCur">00:00</span><span id="tTotal">03:43</span></div>
        <div class="track"><i id="progress"></i></div>
      </div>
    </div>
  </div>

<script>
  /* ---------------- 粒子背景 ---------------- */
  const phone = document.getElementById('phone');
  const canvas = document.getElementById('dust');
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0, dots = [];

  function resize(){
    const r = phone.getBoundingClientRect();
    W = canvas.width = r.width;
    H = canvas.height = r.height;
    dots = [];
    const count = 70;
    for (let i = 0; i < count; i++) {
      dots.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: Math.random() * 1.4 + 0.4,
        vy: -(Math.random() * 0.12 + 0.03),
        vx: (Math.random() - 0.5) * 0.05,
        a: Math.random() * 0.55 + 0.18,
        warm: Math.random() < 0.16
      });
    }
  }

  function frame(){
    ctx.clearRect(0, 0, W, H);
    for (const d of dots) {
      d.y += d.vy; d.x += d.vx;
      if (d.y < -4) { d.y = H + 4; d.x = Math.random() * W; }
      if (d.x < -4) d.x = W + 4;
      if (d.x > W + 4) d.x = -4;
      ctx.beginPath();
      ctx.fillStyle = d.warm ? `rgba(255,150,105,${d.a})` : `rgba(255,255,255,${d.a})`;
      ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
      ctx.fill();
    }
    requestAnimationFrame(frame);
  }
  resize();
  frame();
  window.addEventListener('resize', resize);

  /* ---------------- 歌词时间轴 ---------------- */
  const lineEl = document.getElementById('line');
  const stageEl = document.getElementById('stage');
  const progressEl = document.getElementById('progress');
  const tCurEl = document.getElementById('tCur');
  const pill = document.getElementById('pill');

  const lines = [
    { text: '我如此从未', dur: 430 },
    { text: '把回声留在夜里', dur: 360 },
    { text: '屏幕亮起又暗', dur: 380 },
    { text: '像潮水反复', dur: 420 },
    { text: '听见每一次循环', dur: 350 }
  ];

  const sleep = (ms) => new Promise(r => setTimeout(r, ms));

  // 同一句内位置固定，换句重算；用行列索引构造稳定伪随机
  function seeded(i){
    const x = Math.sin(i * 12.9898 + 78.233) * 43758.5453;
    return x - Math.floor(x);
  }

  function fontSizeFor(len){
    if (len <= 4) return 64;
    if (len === 5) return 58;
    if (len === 6) return 50;
    if (len === 7) return 44;
    return 38;
  }

  function buildLine(text, lineIndex){
    lineEl.innerHTML = '';
    lineEl.classList.remove('show');
    const fs = fontSizeFor(text.length);
    [...text].forEach((ch, i) => {
      const span = document.createElement('span');
      span.textContent = ch;
      span.style.fontSize = fs + 'px';
      const dx = (seeded(lineIndex * 31 + i * 7) - 0.5) * 16;
      const dy = (seeded(lineIndex * 17 + i * 13) - 0.5) * 22;
      const rot = (seeded(lineIndex * 11 + i * 5) - 0.5) * 12;
      span.style.transform = `translate(${dx}px, ${dy}px) rotate(${rot}deg)`;
      span.style.opacity = '0';
      lineEl.appendChild(span);
    });
  }

  async function playLine(text, dur, lineIndex){
    buildLine(text, lineIndex);
    await sleep(30);
    lineEl.classList.add('show');
    const spans = [...lineEl.children];
    // 逐字淡入，制造“从虚空中浮现”的感觉
    for (const s of spans) {
      s.style.opacity = '1';
      s.style.transition = 'opacity 300ms ease';
      await sleep(55);
    }
    await sleep(200);
    // 逐字点亮
    for (const s of spans) {
      s.classList.add('sing');
      await sleep(dur);
      s.classList.remove('sing');
      s.classList.add('done');
    }
    // 整句停留后清空，不做位移
    await sleep(680);
    lineEl.classList.remove('show');
    await sleep(420);
    lineEl.innerHTML = '';
  }

  async function runStage(){
    let i = 0;
    while (true) {
      const l = lines[i % lines.length];
      await playLine(l.text, l.dur, i);
      i++;
    }
  }
  runStage();

  /* ---------------- 进度条模拟 ---------------- */
  let played = 0;
  const total = 223; // 3:43
  setInterval(() => {
    played = (played + 0.25) % total;
    progressEl.style.width = (played / total * 100).toFixed(2) + '%';
    const m = Math.floor(played / 60), s = Math.floor(played % 60);
    tCurEl.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  }, 250);

  /* ---------------- 控件自动隐藏 ---------------- */
  let hideTimer;
  function showUI(){
    phone.classList.remove('ui-hidden');
    clearTimeout(hideTimer);
    hideTimer = setTimeout(() => phone.classList.add('ui-hidden'), 3200);
  }
  phone.addEventListener('click', (e) => {
    if (e.target.closest('.back')) return;
    showUI();
  });
  showUI();
  setTimeout(() => { phone.classList.add('ui-hidden'); }, 3600);

  /* 顶部胶囊 2.6 秒后自动淡出 */
  setTimeout(() => { pill.style.opacity = '0'; }, 2600);
</script>
</body>
</html>
