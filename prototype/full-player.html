<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Echo · 全屏播放器 Demo</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif}
  body{
    display:grid;place-items:center;gap:24px;
    min-height:100vh;
    padding:32px;
    background:#0a0b10;
    color:#e8eaf0;
  }

  /* ------- 五套完整主题 ------- */
  /* 0 · 稻香 —— 暖金麦浪 */
  .t0{--bg0:#1a1409;--bg1:#2a1f0a;--surface:rgba(255,214,102,.06);--primary:#e2a735;--primary-glow:rgba(226,167,53,.35);--text:#fff8e7;--text2:rgba(255,248,231,.55);--track:rgba(226,167,53,.22);--cover1:#f6c563;--cover2:#c88a2a;--cover3:#7a5214}
  /* 1 · 浮夸 —— 电光紫粉 */
  .t1{--bg0:#16081a;--bg1:#280d2e;--surface:rgba(230,110,220,.07);--primary:#e564d8;--primary-glow:rgba(229,100,216,.38);--text:#ffeaf9;--text2:rgba(255,234,249,.55);--track:rgba(229,100,216,.22);--cover1:#f07de8;--cover2:#b53bb0;--cover3:#5a1760}
  /* 2 · 海阔天空 —— 深海蓝青 */
  .t2{--bg0:#07131a;--bg1:#0d2330;--surface:rgba(80,200,220,.07);--primary:#4fc4d8;--primary-glow:rgba(79,196,216,.38);--text:#e6f7fb;--text2:rgba(230,247,251,.55);--track:rgba(79,196,216,.22);--cover1:#5fd4e8;--cover2:#2d8ea0;--cover3:#124654}
  /* 3 · 平凡之路 —— 林间新绿 */
  .t3{--bg0:#0d160d;--bg1:#142516;--surface:rgba(120,210,130,.07);--primary:#78d282;--primary-glow:rgba(120,210,130,.38);--text:#eafbee;--text2:rgba(234,251,238,.55);--track:rgba(120,210,130,.22);--cover1:#8ce095;--cover2:#4a9a55;--cover3:#1e4a24}
  /* 4 · 夜曲 —— 深夜紫靛 */
  .t4{--bg0:#0b0a1a;--bg1:#14112a;--surface:rgba(155,130,230,.07);--primary:#9b82e6;--primary-glow:rgba(155,130,230,.38);--text:#efeaff;--text2:rgba(239,234,255,.55);--track:rgba(155,130,230,.22);--cover1:#b6a3f2;--cover2:#6e55c2;--cover3:#2e2064}

  /* ------- 手机外框 ------- */
  .phone{
    position:relative;
    width:390px;height:844px;border-radius:48px;
    overflow:hidden;
    box-shadow:
      0 30px 80px rgba(0,0,0,.6),
      0 0 0 10px #12131a,
      0 0 0 11px #1f2029;
    background:linear-gradient(180deg,var(--bg0),var(--bg1) 100%);
    transition:background 700ms ease;
  }
  /* 刘海 */
  .notch{
    position:absolute;top:12px;left:50%;transform:translateX(-50%);
    width:110px;height:28px;border-radius:20px;background:#000;z-index:3;
  }

  /* ------- 播放器容器 ------- */
  .player{
    height:100%;padding:60px 28px 40px;
    display:flex;flex-direction:column;
    position:relative;overflow:hidden;
  }

  /* 顶部栏 */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:40px;
  }
  .icon-btn{
    width:40px;height:40px;border:none;background:transparent;color:var(--text);
    border-radius:50%;cursor:pointer;display:grid;place-items:center;
    font-size:18px;opacity:.8;transition:opacity .2s;
  }
  .icon-btn:hover{opacity:1}
  .track-title{font-size:13px;color:var(--text2);font-weight:500;letter-spacing:.5px}

  /* ------- 封面（视觉中心） ------- */
  .cover-wrap{
    display:grid;place-items:center;
    margin-bottom:40px;
  }
  .cover{
    width:234px;height:234px;border-radius:50%;
    background:conic-gradient(from 210deg,var(--cover3),var(--cover2),var(--cover1),var(--cover2),var(--cover3));
    box-shadow:
      0 0 0 2px rgba(255,255,255,.08),
      0 20px 60px var(--primary-glow),
      0 0 120px var(--primary-glow);
    position:relative;
    animation:spin 8s linear infinite;
    animation-play-state:paused;
  }
  .cover.playing{animation-play-state:running}
  .cover::after{
    content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:18px;height:18px;border-radius:50%;
    background:var(--bg0);
    box-shadow:0 0 0 3px var(--bg1),0 0 0 4px rgba(255,255,255,.12);
  }
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ------- 歌曲信息 ------- */
  .info{text-align:center;margin-bottom:36px}
  .title{
    font-size:22px;font-weight:700;color:var(--text);
    letter-spacing:.3px;line-height:1.3;margin-bottom:6px;
    text-shadow:0 2px 20px var(--primary-glow);
  }
  .artist{font-size:14px;color:var(--text2)}

  /* ------- 进度 ------- */
  .progress{margin-bottom:36px}
  .bar{
    height:4px;border-radius:4px;background:var(--track);
    overflow:hidden;cursor:pointer;position:relative;
  }
  .bar-fill{
    height:100%;border-radius:4px;background:var(--primary);
    width:0%;transition:width .2s linear;
  }
  .time-row{
    display:flex;justify-content:space-between;margin-top:10px;
    font-size:11px;color:var(--text2);font-variant-numeric:tabular-nums;
  }

  /* ------- 控制区 ------- */
  .controls{
    display:flex;align-items:center;justify-content:space-between;
    padding:0 6px;margin-bottom:28px;
  }
  .ctrl-btn{
    width:44px;height:44px;border:none;background:transparent;color:var(--text);
    border-radius:50%;cursor:pointer;display:grid;place-items:center;
    transition:all .2s;opacity:.75;
  }
  .ctrl-btn:hover{opacity:1;transform:scale(1.08)}
  .ctrl-btn.play{
    width:74px;height:74px;
    background:var(--primary);color:var(--bg0);
    box-shadow:0 8px 28px var(--primary-glow);opacity:1;
  }
  .ctrl-btn.play:hover{transform:scale(1.06)}
  .ctrl-btn.play:active{transform:scale(.96)}

  /* ------- 歌词 ------- */
  .lyrics{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:8px;text-align:center;overflow:hidden;
  }
  .lyric{
    font-size:13px;color:var(--text2);line-height:1.6;
    transition:all .4s;max-width:300px;
  }
  .lyric.active{
    font-size:15px;font-weight:600;color:var(--text);
    text-shadow:0 0 20px var(--primary-glow);
  }
  .lyric.hidden{opacity:0;transform:translateY(6px)}

  /* SVG 图标 */
  svg{display:block}
</style>
</head>
<body>

<div class="phone t0" id="phone">
  <div class="notch"></div>

  <div class="player">
    <!-- 顶部 -->
    <div class="topbar">
      <button class="icon-btn" title="收起">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 15l6-6 6 6"/></svg>
      </button>
      <div class="track-title">正在播放</div>
      <button class="icon-btn" title="更多">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg>
      </button>
    </div>

    <!-- 封面 -->
    <div class="cover-wrap">
      <div class="cover playing" id="cover"></div>
    </div>

    <!-- 歌名/歌手 -->
    <div class="info">
      <div class="title" id="title">稻香</div>
      <div class="artist" id="artist">周杰伦 · 魔杰座</div>
    </div>

    <!-- 进度 -->
    <div class="progress">
      <div class="bar" id="bar">
        <div class="bar-fill" id="barFill"></div>
      </div>
      <div class="time-row">
        <span id="cur">0:00</span><span id="dur">3:43</span>
      </div>
    </div>

    <!-- 控制 -->
    <div class="controls">
      <button class="ctrl-btn" id="mode" title="播放模式" style="font-size:18px;opacity:.9">
        <svg id="modeIcon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/>
        </svg>
      </button>
      <button class="ctrl-btn" id="prev" title="上一首">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zM20 6v12L10 12z"/></svg>
      </button>
      <button class="ctrl-btn play" id="play" title="播放/暂停">
        <svg id="playIcon" width="30" height="30" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button class="ctrl-btn" id="next" title="下一首">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM4 6v12l10-6z"/></svg>
      </button>
      <button class="ctrl-btn" id="queue" title="队列">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg>
      </button>
    </div>

    <!-- 歌词 -->
    <div class="lyrics" id="lyrics"></div>
  </div>
</div>

<script>
/* ---------- 歌曲数据 ---------- */
const songs = [
  {
    theme: 't0', dur: 223,
    title: '稻香', artist: '周杰伦 · 魔杰座',
    lyrics: [
      [0, '对这个世界如果你有太多的抱怨'],
      [4000, '跌倒了就不敢继续往前走'],
      [8500, '为什么人要这么的脆弱 堕落'],
      [13000, '请你打开电视看看'],
      [17000, '多少人为生命在努力勇敢的走下去'],
      [22000, '我们是不是该知足'],
      [25500, '珍惜一切就算没有拥有'],
      [30000, '还记得你说家是唯一的城堡'],
      [34500, '随着稻香河流继续奔跑'],
    ]
  },
  {
    theme: 't1', dur: 265,
    title: '浮夸', artist: '陈奕迅 · U8',
    lyrics: [
      [0, '有人问我我就会讲'],
      [3500, '但是无人来'],
      [6500, '我期待到无奈'],
      [9500, '有话要讲得不到装载'],
      [13000, '我的心情犹像樽盖'],
      [16500, '等被揭开'],
      [19500, '嘴巴却在养青苔'],
      [23000, '人潮内愈文静'],
      [26500, '愈变得不受理睬'],
    ]
  },
  {
    theme: 't2', dur: 326,
    title: '海阔天空', artist: 'Beyond · 乐与怒',
    lyrics: [
      [0, '今天我 寒夜里看雪飘过'],
      [4500, '怀着冷却了的心窝漂远方'],
      [9000, '风雨里追赶 雾里分不清影踪'],
      [14000, '天空海阔你与我'],
      [17500, '可会变（谁没在变）'],
      [22000, '多少次 迎着冷眼与嘲笑'],
      [26500, '从没有放弃过心中的理想'],
      [31000, '一刹那恍惚 若有所失的感觉'],
      [36000, '不知不觉已变淡'],
    ]
  },
  {
    theme: 't3', dur: 297,
    title: '平凡之路', artist: '朴树 · 猎户星座',
    lyrics: [
      [0, '徘徊着的 在路上的'],
      [3500, '你要走吗 via via'],
      [7000, '易碎的 骄傲着'],
      [10500, '那也曾是我的模样'],
      [14000, '沸腾着的 不安着的'],
      [17500, '你要去哪 via via'],
      [21000, '谜一样的 沉默着的'],
      [24500, '故事你真的在听吗'],
      [28000, '我曾经跨过山和大海'],
    ]
  },
  {
    theme: 't4', dur: 238,
    title: '夜曲', artist: '周杰伦 · 十一月的萧邦',
    lyrics: [
      [0, '一群嗜血的蚂蚁 被腐肉所吸引'],
      [5000, '我面无表情 看孤独的风景'],
      [10000, '失去你 爱恨开始分明'],
      [14500, '失去你 还有什么事好关心'],
      [19000, '当鸽子不再象征和平'],
      [23500, '我终于被提醒 广场上喂食的是秃鹰'],
      [29000, '我用漂亮的押韵'],
      [32500, '形容被掠夺一空的爱情'],
    ]
  },
];

/* ---------- 模式 ---------- */
const MODES = [
  { name:'顺序', icon:'<path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/>' },
  { name:'单曲', icon:'<path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/><text x="12" y="15" text-anchor="middle" font-size="7" fill="currentColor" stroke="none">1</text>' },
  { name:'随机', icon:'<path d="M16 3h5v5"/><path d="M4 20L21 3"/><path d="M21 16v5h-5"/><path d="M15 15l6 6"/><path d="M4 4l5 5"/>' },
];

/* ---------- 状态 ---------- */
let idx = 0;
let playing = true;
let mode = 0;
let posMs = 0;
let lastTick = 0;

/* ---------- DOM ---------- */
const $ = id => document.getElementById(id);
const phone = $('phone');
const cover = $('cover');
const play = $('play');
const playIcon = $('playIcon');
const barFill = $('barFill');
const bar = $('bar');
const curEl = $('cur'), durEl = $('dur');
const titleEl = $('title'), artistEl = $('artist');
const lyricsEl = $('lyrics');
const modeBtn = $('mode');
const modeIcon = $('modeIcon');

function fmt(sec){ const m=Math.floor(sec/60), s=Math.floor(sec%60); return m+':'+(s<10?'0':'')+s; }

/* ---------- 渲染 ---------- */
function renderSong(){
  const s = songs[idx];
  // 主题（立即切换背景色，封面渐变跟随 CSS 变量过渡）
  phone.className = 'phone ' + s.theme;
  titleEl.textContent = s.title;
  artistEl.textContent = s.artist;
  durEl.textContent = fmt(s.dur);
  posMs = 0;
  renderProgress();
  renderLyrics();
  updateModeIcon();
}

function renderProgress(){
  const s = songs[idx];
  const pct = Math.min(100, posMs / (s.dur*1000) * 100);
  barFill.style.width = pct + '%';
  curEl.textContent = fmt(posMs/1000);
}

function renderLyrics(){
  const s = songs[idx];
  const lines = s.lyrics;
  // 找到当前行：最后一个 <= posMs
  let activeIdx = -1;
  for(let i=0;i<lines.length;i++) if(lines[i][0] <= posMs) activeIdx = i;
  // 显示 activeIdx-1, activeIdx, activeIdx+1（共 3 行）
  const html = [];
  for(let i=-1;i<=1;i++){
    const k = activeIdx + i;
    if(k<0 || k>=lines.length){
      html.push('<div class="lyric hidden">·</div>');
    } else if(i===0){
      html.push('<div class="lyric active">' + lines[k][1] + '</div>');
    } else {
      html.push('<div class="lyric">' + lines[k][1] + '</div>');
    }
  }
  lyricsEl.innerHTML = html.join('');
}

function updateModeIcon(){
  modeIcon.innerHTML = MODES[mode].icon;
}

/* ---------- 播放循环 ---------- */
function tick(ts){
  if(!lastTick) lastTick = ts;
  const dt = ts - lastTick; lastTick = ts;
  if(playing){
    posMs += dt;
    const s = songs[idx];
    if(posMs >= s.dur*1000){
      // 下一首逻辑
      posMs = 0;
      if(mode===1){ /* 单曲：保持 idx 不变 */ }
      else if(mode===2){ idx = Math.floor(Math.random()*songs.length); renderSong(); }
      else { idx = (idx+1) % songs.length; renderSong(); }
    } else {
      renderProgress();
      renderLyrics();
    }
  }
  requestAnimationFrame(tick);
}

/* ---------- 事件 ---------- */
play.addEventListener('click', ()=>{
  playing = !playing;
  cover.classList.toggle('playing', playing);
  playIcon.innerHTML = playing
    ? '<rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/>'
    : '<path d="M8 5v14l11-7z"/>';
});

$('prev').addEventListener('click', ()=>{
  idx = (idx - 1 + songs.length) % songs.length;
  renderSong();
});
$('next').addEventListener('click', ()=>{
  idx = (idx + 1) % songs.length;
  renderSong();
});

modeBtn.addEventListener('click', ()=>{
  mode = (mode + 1) % MODES.length;
  updateModeIcon();
});

bar.addEventListener('click', e=>{
  const rect = bar.getBoundingClientRect();
  const pct = (e.clientX - rect.left) / rect.width;
  posMs = Math.round(pct * songs[idx].dur * 1000);
  renderProgress();
  renderLyrics();
});

/* ---------- 启动 ---------- */
renderSong();
requestAnimationFrame(tick);
</script>
</body>
</html>
